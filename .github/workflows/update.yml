name: refresh
on:
  # BACKSTOP ONLY. These are the same times cron/worker.js holds, and it
  # is the one that fires on time: measured over twelve consecutive
  # scheduled runs, GitHub was a median of 152 minutes late, worst 305,
  # never within five minutes, and it dropped the 13:45 slot entirely on
  # every one of those days. The Cloudflare worker dispatches the workflow
  # through the API instead, which starts within seconds, and skips its
  # dispatch if one of these already ran in the last 20 minutes. Keep them
  # until that worker has a few clean days behind it; see cron/README.md.
  schedule:
    # times are UTC; UK is +1 during BST.
    - cron: "35 8 * * *"    # 09:35 UK  full refresh, after scores finalise
    - cron: "45 13 * * *"   # 14:45 UK  news, after the 12:30 kick-off finishes
    - cron: "0 17 * * *"    # 18:00 UK  news, after the 15:00 kick-off finishes
    - cron: "45 17 * * 4"   # 18:45 UK Thursdays: waivers usually process at
                            # 18:30 UK; this carries the new squads onto the
                            # site (owner sync) before the evening research run
    - cron: "20 22 * * *"   # 23:20 UK  news, after the 20:00 kick-off finishes
  # a code change should be validated against real data straight away
  # rather than waiting on the next cron. The commit step only ever writes
  # under data/, so the bot's own pushes cannot retrigger this.
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      news_only:
        description: "Skip the model refit and only update the news feed"
        type: boolean
        default: false
concurrency:
  group: refresh          # queue overlapping runs; they all push to main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      # full history: the commit step rebases, which can fail on a shallow clone
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt

      # morning cron, code pushes, and plain manual runs: full pull, refit,
      # predictions, and the news feed off the back of it
      - name: full refresh
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'schedule' && github.event.schedule == '35 8 * * *') ||
          (github.event_name == 'workflow_dispatch' && !inputs.news_only)
        run: python -m schwaddy.refresh --league-id 9450
        working-directory: src

      # the other crons: the day's matches have wrapped up, so post the
      # matchday recap against the morning run's forecasts without refitting
      - name: matchday news
        if: >-
          (github.event_name == 'schedule' && github.event.schedule != '35 8 * * *') ||
          (github.event_name == 'workflow_dispatch' && inputs.news_only)
        run: python -m schwaddy.refresh --league-id 9450 --news-only
        working-directory: src

      # Commit first, then rebase onto whatever landed on main meanwhile.
      # The checkout is pinned to the SHA the run was queued at, so a run
      # that queued behind another one starts behind main; the old
      # "pull --rebase --autostash" then re-applied the stash over the
      # other run's data, and when both had rewritten the same file it
      # committed the conflict markers as JSON (player_stats.json and
      # prices.json, 3 Sep). Every file this run writes is regenerated from
      # the API at run time, so on a clash this run's copy is the fresher
      # one: -X theirs on a rebase means exactly that. Then prove every
      # data file still parses before it goes anywhere near main.
      - name: commit
        run: |
          git config user.name schwaddy-bot
          git config user.email bot@justinwaddy.co.uk
          git add data/
          git commit -m "auto refresh" || { echo "no changes"; exit 0; }
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin main; then
              python3 - <<'EOF'
          import glob, json, sys
          bad = []
          for f in glob.glob("data/*.json"):
              try:
                  t = open(f, encoding="utf-8").read()
                  assert "<<<<<<<" not in t and ">>>>>>>" not in t, "conflict markers"
                  json.loads(t)
              except Exception as ex:
                  bad.append(f"{f}: {ex}")
          if bad:
              print("REFUSING TO PUSH, broken data files:\n  " + "\n  ".join(bad))
              sys.exit(1)
          print("all data/*.json parse")
          EOF
              git push && exit 0
            else
              git rebase --abort || true
            fi
            echo "push race, retry $i"; sleep 10
          done
          echo "could not push after 4 attempts"; exit 1
