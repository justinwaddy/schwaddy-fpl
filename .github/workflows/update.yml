name: refresh
on:
  schedule:
    - cron: "35 8 * * *"   # 09:35 UK during BST, after scores finalise at 09:00
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m schwaddy.refresh --league-id 9450
        working-directory: src
      - run: |
          git config user.name schwaddy-bot
          git config user.email bot@justinwaddy.co.uk
          git add data/ && git commit -m "auto refresh" || echo "no changes"
          git push
