# A suggested headline or roast, filed from a per-manager site.
#
# The sites are static, so the box on the News tab posts to the Cloudflare
# worker (cron/worker.js), which dispatches this. The worker only needs
# permission to start a workflow; the committing is done here, with the
# runner's own credentials, so the token handed to Cloudflare never needs
# write access to the repository contents.
#
# Everything arriving from that endpoint is untrusted, so the inputs are
# passed through the environment and parsed by a script rather than
# interpolated into a shell line.
name: suggest
on:
  workflow_dispatch:
    inputs:
      from_name:
        description: "Who is suggesting it"
        required: true
        type: string
      about_name:
        description: "Who it is about, blank for the league in general"
        required: false
        default: ""
        type: string
      text:
        description: "The suggestion"
        required: true
        type: string
      image_b64:
        # A picture that came with the suggestion, base64, no data: prefix.
        # It arrives this way because the worker's token may start a
        # workflow and nothing else - it cannot write a file to the
        # repository, so the runner does it. The script checks the length,
        # the encoding and the first bytes again before writing anything.
        description: "An optional picture, base64 encoded"
        required: false
        default: ""
        type: string
concurrency:
  group: suggest          # one writer at a time; they all append to one file
  cancel-in-progress: false
jobs:
  append:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: append
        env:
          FROM_NAME: ${{ inputs.from_name }}
          ABOUT_NAME: ${{ inputs.about_name }}
          TEXT: ${{ inputs.text }}
          IMAGE_B64: ${{ inputs.image_b64 }}
        run: python3 .github/scripts/append_roast.py
      - name: commit
        run: |
          git config user.name schwaddy-bot
          git config user.email bot@justinwaddy.co.uk
          # feedback.json only exists once somebody files a bug or an idea,
          # and `git add` on a missing path exits 128, which under `bash -e`
          # killed the job *after* the roast had been appended - three of
          # Edward's suggestions were written to the runner's disk and thrown
          # away with it. data/roast_img, which holds the pictures, is the
          # same: it exists only once somebody has sent one, and it is
          # staged as a directory so a picture the archive has aged out of
          # is staged as the deletion it is. Add whichever are there.
          for f in data/roasts.json data/feedback.json data/roast_img; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          git commit -m "from the league: a suggestion or a report" || { echo "nothing new"; exit 0; }
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin main; then
              python3 -c "import json,os;[print(f,'parses') or json.load(open(f)) for f in ('data/roasts.json','data/feedback.json') if os.path.exists(f)]"
              git push && exit 0
            else
              git rebase --abort || true
            fi
            echo "push race, retry $i"; sleep 5
          done
          echo "could not push after 4 attempts"; exit 1
