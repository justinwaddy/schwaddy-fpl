name: pages
on:
  # the dashboard is a static bundle: publish whenever the pages change.
  # data/ is fetched at runtime from raw.githubusercontent.com, so the
  # bot's refresh pushes do not need to redeploy the site.
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
concurrency:
  group: pages            # one live site; a newer deploy supersedes an older one
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deploy
        uses: actions/deploy-pages@v4
