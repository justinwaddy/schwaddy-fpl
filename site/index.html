<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>27 Richmond Road Cup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="team.css">
<style>
main{padding:4px 12px 40px;max-width:680px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.who{display:flex;flex-direction:column;justify-content:center;aspect-ratio:1;
background:var(--panel);border:1px solid var(--line);border-radius:12px;
padding:14px 16px;text-decoration:none;color:var(--ink);transition:border-color .12s}
.who:hover,.who:focus-visible{border-color:var(--blue);background:var(--panel2);outline:none}
.who b{font:600 clamp(22px,7vw,38px) "Barlow Condensed",system-ui;letter-spacing:.03em;
text-transform:uppercase;line-height:1.05}
.who span{display:block;color:var(--dim);font:500 12px "IBM Plex Mono",ui-monospace,monospace;
padding-top:4px}
.who em{font-style:normal;color:var(--blue)}
</style>
</head>
<body>
<header>
<h1><em>27</em> Richmond Road Cup</h1>
<div class="sub">Six managers, one draft league</div>
</header>
<main>
<div class="grid">
<a class="who" href="ed/"><b>Edward</b><span>Return of the Djedi</span></a>
<a class="who" href="sben/"><b>Small Ben</b><span>Delap Dance</span></a>
<a class="who" href="bben/"><b>Big Ben</b><span>Quantum of Tzolis</span></a>
<a class="who" href="marcus/"><b>Marcus</b><span>Haramball Enthusiast</span></a>
<a class="who" href="rob/"><b>Robert</b><span>Pardinho</span></a>
<a class="who" href="justin/"><b>Justin</b><span>Schwaddy</span></a>
</div>
</main>
<script src="feedback.js"></script>
</body></html>
