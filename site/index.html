<style>
:root{--bg:#0F1A31;--panel:#16233F;--panel2:#1C2B4D;--line:#26365C;--ink:#E9EEF8;

*{box-sizing:border-box;margin:0;padding:0}

.sub{color:var(--dim);font:500 12px "IBM Plex Mono"}
nav{display:flex;gap:6px;padding:10px 12px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:5}

.tab.on{color:var(--ink);border-color:var(--blue);background:var(--panel2)}
section{padding:8px 12px 40px;display:none}section.on{display:block}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 6px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
th{font:600 11px "IBM Plex Mono";color:var(--dim);cursor:pointer;white-space:nowrap}
td.num{font:500 13px "IBM Plex Mono";text-align:right;white-space:nowrap}

.fx{font-size:11px;padding:1px 4px;border-radius:4px;font-weight:600}
.fx-good,.run.fx-good{color:var(--green)}

.chip.on{color:var(--ink);border-color:var(--blue);background:var(--panel2)}

.lv td.num.live{color:var(--green)}

.fxscore{font:600 17px "Barlow Condensed";letter-spacing:.04em}

const CAP={GKP:2,DEF:5,MID:5,FWD:3};
let DATA=null,NEXT=0;
function nextGW(ps){for(let g=0;g<38;g++){if(ps.some(p=>p.gw&&p.gw[g]>0))return g;}return 37;}
function pickXI(sq,key){
  const by={GKP:[],DEF:[],MID:[],FWD:[]};
  sq.forEach(p=>{if(by[p.pos])by[p.pos].push(p)});
  for(const k in by)by[k].sort((a,b)=>b[key]-a[key]);
  let best=-1e18,xi=null,form=null;
  for(let d=3;d<=5;d++)for(let m=2;m<=5;m++){const f=10-d-m;if(f<1||f>3)continue;
    if(by.GKP.length<1||by.DEF.length<d||by.MID.length<m||by.FWD.length<f)continue;
    const c=[by.GKP[0],...by.DEF.slice(0,d),...by.MID.slice(0,m),...by.FWD.slice(0,f)];
    const s=c.reduce((a,p)=>a+p[key],0);
    if(s>best){best=s;xi=c;form=[d,m,f];}}
  return {xi:xi||[],form,total:best>-1e17?best:0};
}
function spark(gw){
  const w=90,h=20,n=Math.min(38,gw.length);
  const mx=Math.max(...gw,1);
  let pts="";
  for(let i=0;i<n;i++){pts+=(i*(w/n)).toFixed(1)+","+(h-gw[i]/mx*h).toFixed(1)+" ";}
  return `<svg class="spark" width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="#4A7FE0" stroke-width="1.4"/></svg>`;
}
function posord(p){return {GKP:0,DEF:1,MID:2,FWD:3}[p]}
function render(){
  const ps=DATA.players;NEXT=nextGW(ps);
  document.getElementById("meta").textContent=
    `updated ${DATA.generated?DATA.generated.slice(0,16).replace("T"," "):"?"} UTC · next: GW${NEXT+1} · λ=(${DATA.lambda_time}, ${DATA.lambda_nn??"∞"}) · ${DATA._src}`;
  renderSquad(ps);renderWaivers(ps);renderLeague(ps);renderPlayers(ps);
}
function renderSquad(ps){
  const mine=ps.filter(p=>p.mine);
  mine.forEach(p=>p.ep=p.gw?p.gw[NEXT]:0);
  const {xi,form,total}=pickXI(mine,"ep");
  const xiset=new Set(xi.map(p=>p.name));
  const bench=mine.filter(p=>!xiset.has(p.name)).sort((a,b)=>(a.pos==="GKP"?-1:0)-(b.pos==="GKP"?-1:0)||b.ep-a.ep);
  let h=`<div class="card"><b class="h">GW${NEXT+1} XI · ${form?form.join("-"):""} · E[pts] ${total.toFixed(1)}</b><table>`;
  for(const p of xi.sort((a,b)=>posord(a.pos)-posord(b.pos)||b.ep-a.ep))
    h+=row(p,`<td class="num">${p.ep.toFixed(1)}</td>`);
  h+=`</table></div><div class="card"><b class="h">Bench order</b><table>`;
  bench.forEach((p,i)=>h+=row(p,`<td class="num">${p.ep.toFixed(1)}</td>`,i+1));
  h+=`</table></div><div class="card"><b class="h">Next ${HZ()} gameweeks</b>
  <div class="note">Fixture-adjusted. <b>fix</b> is what this run is worth against an average one, in points, from the model's own opponent terms - green is a kind draw, red a hard one.</div><table>
  <tr><th>player</th><th></th><th style="text-align:right">next ${HZ()}</th><th style="text-align:right">fix</th><th>run</th></tr>`;
  for(const p of [...mine].sort((a,b)=>N5(b)-N5(a)))
    h+=`<tr><td><span class="nm">${p.name}</span> <span class="tm">${p.pos}</span>${p.news?`<span class="flag">${p.news}</span>`:""}</td><td></td><td class="num">${N5(p).toFixed(1)}</td><td class="num">${fixTag(p)}</td><td>${runHTML(p)}</td></tr>`;
  h+=`</table></div><div class="card"><b class="h">Rest of season</b><table>
  <tr><th>player</th><th></th><th style="text-align:right">rest</th><th>shape</th></tr>`;
  for(const p of [...mine].sort((a,b)=>b.rest-a.rest))
    h+=`<tr><td><span class="nm">${p.name}</span> <span class="tm">${p.pos}</span>${p.news?`<span class="flag">${p.news}</span>`:""}</td><td></td><td class="num">${Math.round(p.rest)}</td><td>${spark(p.gw||[])}</td></tr>`;
  h+=`</table></div>`;
  document.getElementById("squad").innerHTML=h;
}
// Five-gameweek totals. Older predictions.json files (and the embedded
// fallback) have no next5, so fall back to a flat slice of the season.
const N5=p=>p.next5!=null?p.next5:(p.rest||0)*5/38;
const HZ=()=>DATA.horizon||5;
// Fixture ticker: upper case is home, lower case away, "-" a blank.
// Coloured by the model's own fixture term for that player, in points
// against an average run, so it says what the run is worth rather than
// how hard it looks.
function runHTML(p){
  if(!p.run||!p.run.length)return "";
  const f=p.fix5;
  const cls=f==null?"":(f>0.3?"fx-good":f<-0.3?"fx-bad":"fx-mid");
  return `<span class="run ${cls}" title="${f==null?"":(f>0?"+":"")+f.toFixed(1)+" pts vs an average run"}">${p.run.join(" ")}</span>`;
}
function fixTag(p){
  if(p.fix5==null)return "";
  return `<span class="fx ${p.fix5>0.3?"fx-good":p.fix5<-0.3?"fx-bad":"fx-mid"}">${p.fix5>0?"+":""}${p.fix5.toFixed(1)}</span>`;
}
function row(p,extra,pre){
  return `<tr><td>${pre?pre+". ":""}<span class="nm">${p.name}</span> <span class="tm">${p.team??""}</span>${p.news?`<span class="flag">${p.news}</span>`:""}</td><td><span class="pos ${p.pos}">${p.pos}</span></td>${extra}</tr>`;
}
// Points over the horizon a free agent must clear to justify a swap. On
// the old rest-of-season scale this was 8; five gameweeks is about an
// eighth of a season, and the fixture run is worth roughly a point of it.
const MARGIN=2;
function waiverPlan(mine,free){
  const sq=[...mine],pool=[...free],plan=[];
  while(plan.length<8){
    let best=null;
    for(const pos of ["GKP","DEF","MID","FWD"]){
      const drops=sq.filter(p=>p.pos===pos).sort((a,b)=>N5(a)-N5(b));
      if(!drops.length)continue;
      const d=drops[0];
      const f=pool.filter(p=>p.pos===pos).sort((a,b)=>N5(b)-N5(a))[0];
      if(f&&N5(f)-N5(d)>MARGIN&&(!best||N5(f)-N5(d)>best.gain))
        best={add:f,drop:d,gain:N5(f)-N5(d),pos};
    }
    if(!best)break;
    plan.push(best);
    sq.splice(sq.indexOf(best.drop),1);sq.push(best.add);
    pool.splice(pool.indexOf(best.add),1);pool.push(best.drop);
  }
  return plan;

/* ---------------- Live tab ----------------
   Polls the worker (live/worker.js) for one bundled snapshot of the
   gameweek and does the arithmetic here: points, provisional bonus and
   provisional subs, under the same rules weekly.py applies, so this tab
   and the cron's League tab agree once a gameweek settles. */
let LIVE=null,LIVEERR=null,LIVEOPEN=null,LIVETIMER=null,LIVEAUTO=false,LIVECTX=null;
const DEFRULES={play:11,min_GKP:1,max_GKP:1,min_DEF:3,max_DEF:5,min_MID:2,max_MID:5,min_FWD:1,max_FWD:3};
// FPL bonus: 3/2/1 on bps; a tie shares the higher award and swallows the
// places below it. Only counts until the official bonus is in the feed.
function provBonus(f){
  const out={};
  if(!f.started||f.bonus_in)return out;
  const s=f.bps.filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  let i=0;
  while(i<s.length&&i<3){
    const v=s[i][1],grp=s.filter(x=>x[1]===v),pts=[3,2,1][i];
    grp.forEach(x=>out[x[0]]=pts);i+=grp.length;
  }
  return out;
}
function applySubs(squad,R){            // mirror of weekly.apply_subs
  const start=squad.filter(p=>p.slot<=R.play),bench=squad.filter(p=>p.slot>R.play);
  let counts={};start.forEach(p=>counts[p.pos]=(counts[p.pos]||0)+1);
  const breach=c=>["GKP","DEF","MID","FWD"].reduce((a,k)=>
    a+Math.max(0,R["min_"+k]-(c[k]||0))+Math.max(0,(c[k]||0)-R["max_"+k]),0);
  const used=new Set();
  for(const gone of start.filter(p=>p.settled&&!p.played)){
    for(const c of bench){
      if(used.has(c.id)||!c.played)continue;
      if((gone.pos==="GKP")!==(c.pos==="GKP"))continue;   // keepers only for keepers
      const t={...counts};t[gone.pos]=(t[gone.pos]||0)-1;t[c.pos]=(t[c.pos]||0)+1;
      if(breach(t)>breach(counts))continue;
      gone.subbed_out=true;c.subbed_in=true;used.add(c.id);counts=t;break;
    }
  }
}
function liveTable(S){
  const R={...DEFRULES};
  for(const k in (S.rules||{}))if(Number.isInteger(S.rules[k]))R[k]=S.rules[k];
  const teamFx={};
  S.fixtures.forEach(f=>{(teamFx[f.h]=teamFx[f.h]||[]).push(f);(teamFx[f.a]=teamFx[f.a]||[]).push(f);});
  const bonus={};
  S.fixtures.forEach(f=>{const b=provBonus(f);for(const k in b)bonus[k]=(bonus[k]||0)+b[k];});
  // a club with no fixture has nothing to come, so it counts as settled;
  // a club with one match done and one to play (double) does not
  const settled=t=>{const fs=teamFx[t]||[];return !fs.length||fs.every(f=>f.fin);};
  const playing=t=>(teamFx[t]||[]).some(f=>f.started&&!f.fin);
  const mgrs=S.managers.map(m=>{
    const squad=m.picks.map(([id,slot])=>{
      const e=S.elements[id]||{n:String(id),t:null,p:"MID",pts:0,min:0,bps:0,fx:[]};
      const pb=bonus[id]||0;
      return {id,slot,name:e.n,pos:e.p,tid:e.t,team:S.teams[e.t]||"?",pts:e.pts+pb,pb,
        mins:e.min,played:e.min>0,settled:settled(e.t),to_play:!settled(e.t),
        playing:playing(e.t),subbed_in:false,subbed_out:false};
    }).sort((a,b)=>a.slot-b.slot);
    applySubs(squad,R);
    const counting=squad.filter(p=>(p.slot<=R.play&&!p.subbed_out)||p.subbed_in);
    const togo=counting.filter(p=>p.to_play);
    return {...m,squad,counting,mine:m.entry===372099,
      live:counting.reduce((a,p)=>a+p.pts,0),
      bench:squad.filter(p=>!counting.includes(p)).reduce((a,p)=>a+p.pts,0),
      to_play:togo.length,played:counting.length-togo.length,
      inplay:counting.filter(p=>p.playing).length,
      subs:squad.filter(p=>p.subbed_in).length};
  });
  mgrs.sort((a,b)=>b.live-a.live||(a.rank??99)-(b.rank??99));
  const inplay=S.fixtures.filter(f=>f.started&&!f.fin);
  const next=S.fixtures.filter(f=>!f.started).map(f=>f.ko).sort()[0]||null;
  return {mgrs,teamFx,inplay,next,allDone:S.fixtures.length>0&&S.fixtures.every(f=>f.fin)};
}

    ${bn.map(cell).join("")}</table>
    <div class="note">${m.played} played, ${m.to_play} to come${m.inplay?`, ${m.inplay} on the pitch now`:""}${
      m.subs?` · ${m.subs} provisional sub${m.subs>1?"s":""}`:""}.
      An amber +b is provisional bonus from the bps table; it becomes real when FPL posts it.</div></div>`;
}
function renderLive(){
  const sec=document.getElementById("live");
  let h="";
  if(!LIVE){
    h+=`<div class="card"><b class="h">Live scores</b><div class="note">${
      LIVE_URL?`Cannot reach the live worker${LIVEERR?` (${LIVEERR})`:""}. Retrying.`:
      `Not switched on yet. Deploy <code>live/worker.js</code> to Cloudflare (free, five
       minutes, steps in <code>live/README.md</code>) and paste its URL into
       <code>LIVE_URL</code> at the top of this page's script.`}</div>`;
    if(WK&&WK.managers){
      const st=[...WK.managers].sort((a,b)=>b.live-a.live);
      h+=`<div class="note">Last cron snapshot, ${WK.generated?WK.generated.replace("T"," "):"?"} UTC, GW${WK.gw}:</div>
        <table><tr><th>manager</th><th class="num">GW</th><th class="num">to play</th><th class="num">season</th></tr>`;
      for(const m of st)h+=`<tr class="${m.mine?"mine-row":""}"><td><span class="nm">${m.name}</span> <span class="tm">${m.team}</span></td>
        <td class="num">${m.live}</td><td class="num">${m.to_play}</td><td class="num">${m.total??"–"}</td></tr>`;
      h+=`</table>`;
    }
    h+=`</div>`;sec.innerHTML=h;return;
  }
  const S=LIVE,ctx=liveTable(S);LIVECTX=ctx;
  const upd=(S.fetched||"").slice(11,19);
  const status=ctx.inplay.length?`<span class="livedot"></span><b>LIVE</b> · ${ctx.inplay.length} match${ctx.inplay.length>1?"es":""} in play`:
    ctx.allDone?`GW${S.gw} ${S.finished?"final":"all played, awaiting bonus and processing"}`:
    ctx.next?`Next kick-off ${koText(ctx.next)}`:`GW${S.gw}`;
  h+=`<div class="card scorecard"><b class="h">Gameweek ${S.gw}</b>
    <div class="lvstatus">${status} · feed ${upd} UTC${LIVEERR?` · <span class="stale">worker unreachable, showing last good feed</span>`:""}</div>
    <table class="lv"><tr><th></th><th>manager</th><th class="num">GW</th><th class="num">on pitch</th>
    <th class="num">to play</th><th class="num">bench</th><th class="num">season</th></tr>`;
  ctx.mgrs.forEach((m,i)=>{
    h+=`<tr class="clk ${m.mine?"mine-row":""}" data-lent="${m.entry}"><td class="tm">${i+1}</td>
      <td><span class="nm">${m.name}</span> <span class="tm">${m.team}</span> <span class="chev">${LIVEOPEN===m.entry?"▾":"▸"}</span></td>
      <td class="num ${m.inplay?"live":""}">${m.live}</td><td class="num">${m.inplay||""}</td>
      <td class="num">${m.to_play||""}</td><td class="num"><span class="tm">${m.bench}</span></td>
      <td class="num">${m.total??"–"}</td></tr>`;
    if(LIVEOPEN===m.entry)h+=`<tr><td colspan="7" style="padding:0 0 6px">${liveManagerHTML(m,ctx)}</td></tr>`;
  });
  h+=`</table><div class="note">GW is this week's XI with provisional bonus and provisional subs.
    Season is the table as FPL has it; it moves when the gameweek is processed.</div></div>`;
  // fixtures: in play first, then by kick-off, finished last
  const order=f=>f.started&&!f.fin?0:!f.started?1:2;
  const fxs=[...S.fixtures].sort((a,b)=>order(a)-order(b)||(a.ko<b.ko?-1:a.ko>b.ko?1:0));
  h+=`<div class="card"><b class="h">Fixtures</b><div class="fxwrap">`;
  for(const f of fxs){
    const chips=[];
    for(const m of ctx.mgrs)for(const p of m.counting)if(p.tid===f.h||p.tid===f.a)
      chips.push({p,who:m.name,mine:m.mine});
    chips.sort((a,b)=>b.p.pts-a.p.pts||a.p.name.localeCompare(b.p.name));
    const sc=f.started?`${f.hs??0} - ${f.as??0}`:"v";
    h+=`<div><div class="fxrow"><span class="fxscore"><span class="tm">${S.teams[f.h]||f.h}</span> ${sc} <span class="tm">${S.teams[f.a]||f.a}</span></span>${fxState(f)}</div>
      <div class="fxplayers">${chips.length?chips.map(c=>`<span class="fxchip ${c.mine?"mine":""}">${c.p.name} ${
        f.started?c.p.pts:""}${c.p.pb?`<span class="provb">+${c.p.pb}</span>`:""} <span class="who">· ${c.who}</span></span>`).join(""):
        `<span class="tm" style="font-size:11px">no one in the league has a starter here</span>`}</div></div>`;
  }
  h+=`</div></div>`;
  sec.innerHTML=h;
  sec.querySelectorAll("[data-lent]").forEach(r=>r.addEventListener("click",()=>{
    const e=+r.dataset.lent;LIVEOPEN=(LIVEOPEN===e?null:e);renderLive();}));
}
function liveDelay(){
  if(!LIVE||!LIVECTX)return 60e3;
  if(LIVECTX.inplay.length)return Math.max(15,LIVE.ttl||30)*1000;
  const ms=LIVECTX.next?new Date(LIVECTX.next)-Date.now():Infinity;
  return ms<15*60e3?60e3:5*60e3;         // wake up as kick-off nears
}
async function pollLive(){
  clearTimeout(LIVETIMER);
  if(!LIVE_URL){renderLive();return;}
  try{
    const r=await fetch(LIVE_URL,{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();
    if(j.error)throw new Error(j.error);
    LIVE=j;LIVEERR=null;
  }catch(e){LIVEERR=String(e.message||e);}
  renderLive();
  if(LIVE&&LIVECTX&&LIVECTX.inplay.length&&!LIVEAUTO){LIVEAUTO=true;document.getElementById("livetab").click();}
  if(!document.hidden)LIVETIMER=setTimeout(pollLive,liveDelay());
}
document.addEventListener("visibilitychange",()=>{if(document.hidden)clearTimeout(LIVETIMER);else pollLive();});
pollLive();
fetch(RAW_URL,{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()})
  .then(j=>{j._src="live from GitHub";DATA=j;render();})
  .catch(()=>{FALLBACK._src="embedded snapshot (push the repo for daily updates)";DATA=FALLBACK;render();});
</script>
</body></html>
