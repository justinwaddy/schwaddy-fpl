# Punctual scheduler for the refresh workflow. See cron/README.md.
name = "schwaddy-cron"
main = "worker.js"
compatibility_date = "2026-09-01"

# UTC, and the same times update.yml lists. GitHub keeps its own copy as a
# backstop; these are the ones that actually fire on time.
[triggers]
crons = [
  "35 8 * * *",    # 09:35 UK  full refresh, after scores finalise
  "45 13 * * *",   # 14:45 UK  news, after the 12:30 kick-off finishes
  "0 17 * * *",    # 18:00 UK  news, after the 15:00 kick-off finishes
  "45 17 * * 4",   # 18:45 UK  Thursday, just after waivers process
  "20 22 * * *",   # 23:20 UK  news, after the 20:00 kick-off finishes
]
